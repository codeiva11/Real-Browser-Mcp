name: 🧪 Detector Tests

# CI coverage for the detector suite (test/test.mjs), restored after the old
# "Auto Upstream Sync & Patch" workflow was removed in ef8ac1c5 (2026-11-22).
# The old workflow CANNOT be restored verbatim: it checked/installed the npm
# `patchright` package, which 3.5.2 replaced with `patchwright-core`, and it
# only ran the suite when a new patchright version appeared. This workflow
# runs the suite directly against the current code — on every push, daily,
# and on demand. It does NOT sync upstream, commit, or publish anything.

on:
  push:
    branches: [main]
  schedule:
    # Daily at 03:00 UTC (same slot as the old sync workflow)
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: detector-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detectors:
    name: 🧪 Detector Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v5

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🔨 Build
        run: npm run build

      - name: 🔤 Install desktop fonts (Pixelscan coherence)
        run: |
          # Pixelscan's fingerprint check verifies the installed font set
          # against the claimed OS (server-side osFontsStatus). The bare
          # ubuntu runner image lacks the signature fonts of a real Ubuntu
          # desktop, so the masking card fails even though every other
          # signal is coherent (verified: the exact runner font set scores
          # osFontsStatus=false, and adding Ubuntu + Droid Sans Fallback +
          # Liberation Sans Narrow flips it to true). Install the
          # real-desktop font set before the test suite runs.
          # CORRECTION (run 44724983509): the rule is a required SET, not
          # just the three signature fonts. The runner's own /co diagnostic
          # showed only 14 of 97 core fonts detected (Ubuntu + Droid +
          # Liberation Sans Narrow all present) yet osFontsStatus=false.
          # Bisecting the exact runner set against /co proved all 8 of
          # Noto Serif/Sans(-Mono) CJK JP/SC/HK/KR + Abyssinica SIL +
          # OpenSymbol are also required: 21 of 22 scores false, all 22
          # score true. The runner image lacks all 8 (no Noto CJK,
          # no Abyssinica, no OpenSymbol), so install them too.
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-ubuntu fonts-droid-fallback fonts-liberation2 fonts-freefont-ttf fonts-noto-cjk fonts-sil-abyssinica fonts-opensymbol
          # NOTE: fonts-liberation2 (Liberation 2.x, Croscore-based) does
          # NOT contain Liberation Sans Narrow — it was dropped in 2.0 and
          # split into its own upstream project (liberationfonts/
          # liberation-sans-narrow). That is why run 44723268530 still
          # failed: the package installed but no "Liberation Sans Narrow"
          # family ever appeared in fc-list. Install Narrow from the
          # upstream 1.07.5 release tarball instead.
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-ubuntu fonts-droid-fallback fonts-liberation2 fonts-freefont-ttf
          sudo mkdir -p /usr/share/fonts/truetype/liberation-narrow
          curl -fsSL --retry 3 -o /tmp/liberation-narrow-ttf.tar.gz https://github.com/liberationfonts/liberation-sans-narrow/releases/download/1.07.5/liberation-narrow-fonts-ttf-1.07.5.tar.gz
          sudo tar -xzf /tmp/liberation-narrow-ttf.tar.gz -C /tmp
          sudo find /tmp -name 'LiberationSansNarrow-*.ttf' -exec cp {} /usr/share/fonts/truetype/liberation-narrow/ \; -print
          fc-cache -f
          echo "Desktop font families now present:"
          fc-list : family | sort -u | grep -E "Ubuntu|Droid Sans Fallback|Liberation Sans Narrow|FreeSerif|FreeSans|FreeMono" || true
          echo "Full installed font families:"
          fc-list : family | sort -u || true
          # Diagnostic (never fails the step): ask Pixelscan's own server
          # whether the fonts this runner actually exposes score as a
          # coherent Linux desktop (osFontsStatus), using its /gf core
          # list intersected with fc-list.
          python3 - <<'PYEOF' || true
          import json, subprocess, time, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/156.0.0.0 Safari/537.36"}
          def post(url, payload):
              last = None
              for _ in range(3):
                  try:
                      req = urllib.request.Request(url, data=json.dumps(payload).encode(), method="POST", headers={"Content-Type": "application/json", **UA})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return json.load(r)
                  except Exception as e:
                      last = e
                      time.sleep(3)
              raise last
          try:
              core = post("https://pixelscan.net/s/api/gf", {"ic": True, "im": False})["value"]["core"]
              fams = set()
              out = subprocess.check_output(["fc-list", ":", "family"], text=True)
              for line in out.splitlines():
                  for f in line.split(","):
                      f = f.strip()
                      if f:
                          fams.add(f)
              detected = [f for f in core if f in fams]
              v = post("https://pixelscan.net/s/api/co", {"af": 0, "platform": "Linux x86_64", "fonts": detected, "canvas": True})["value"]
              print("[pixelscan-diag] core fonts probed:", len(core), "| detected on runner:", len(detected))
              print("[pixelscan-diag] Ubuntu detected:", "Ubuntu" in detected, "| Droid Sans Fallback:", "Droid Sans Fallback" in detected, "| Liberation Sans Narrow:", "Liberation Sans Narrow" in detected)
              print("[pixelscan-diag] osFontsStatus:", v.get("osFontsStatus"), "| os match:", v.get("comparedResult", {}).get("match"))
          except Exception as e:
              print("[pixelscan-diag] FAILED:", repr(e))
          PYEOF


      - name: 🧪 Run Detector Suite
        run: |
          echo "🧪 Running detector suite (Rebrowser, Sannysoft, Cloudflare WAF, Turnstile, Recaptcha V3, Pixelscan Fingerprint, Pixelscan Bot Check)..."
          # Run both suites independently: `npm test` chains them with &&, so a
          # failing cjs suite would skip esm entirely. Each suite gets its own
          # browser run; both results land in test-output.log for the verdict.
          echo "--- CJS suite ---"
          xvfb-run -a npm run cjs_test > test-output.log 2>&1 || true
          echo "--- ESM suite ---"
          xvfb-run -a npm run esm_test >> test-output.log 2>&1 || true
          cat test-output.log

      - name: 📋 Verdict
        run: |
          echo "=== Detector verdicts ==="
          grep -E "^(✔|✖) " test-output.log || echo "(no per-test result lines found)"
          echo "---"
          # The suite runs twice (cjs + esm); a test failing in either suite counts.
          # MUST-PASS in CI (proven green 2026-11-21 on the old engine):
          # Rebrowser, Sannysoft, Turnstile, Pixelscan Bot Check.
          MUST_PASS=("Rebrowser Bot Detector" "Sannysoft WebDriver Detector" "Cloudflare Turnstile" "Pixelscan Bot Check")
          FAILED=0
          for t in "${MUST_PASS[@]}"; do
            if grep -q "✖ $t" test-output.log; then
              echo "❌ MUST-PASS FAILED: $t"
              FAILED=1
            elif grep -q "✔ $t" test-output.log; then
              echo "✅ $t: PASS"
            else
              echo "❌ $t: NO RESULT (suite did not run it)"
              FAILED=1
            fi
          done
          # Tolerated known fails (environmental / site-side, fail in every CI run):
          # - Cloudflare WAF: nopecha demo wall never clears, even on residential IP
          # - Recaptcha V3 Score: antcpt.com is dead (PHP fatal error, no button)
          # - Pixelscan Fingerprint Check: runner datacenter IP flagged as proxy
          for t in "Cloudflare WAF" "Recaptcha V3 Score" "Pixelscan Fingerprint Check"; do
            if grep -q "✖ $t" test-output.log; then
              echo "⚠️ Known fail (tolerated): $t"
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo "❌ Detector verdict: FAIL — a must-pass detector failed."
            exit 1
          fi
          echo "✅ Detector verdict: PASS — all must-pass detectors green."
