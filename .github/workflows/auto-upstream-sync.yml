SHA: c5a40796b8b0b4d8d904c3b329b53fd4c86a40fb SIZE: 4088
name: 🔄 Auto Upstream Sync & Patch

on:
  schedule:
    # Run daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force test and sync even if versions match'
        required: false
        default: false
        type: boolean

jobs:
  sync:
    name: 🔄 Check Upstream & Auto-Patch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: ⚙️ Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 🔍 Check Upstream Version
        id: check_version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').dependencies['patchright'] || ''")
          INSTALLED_VERSION=$(node -p "try { require('./node_modules/patchright/package.json').version } catch { '' }")
          LATEST_VERSION=$(npm view patchright version)

          echo "Current in package.json: $CURRENT_VERSION"
          echo "Installed: $INSTALLED_VERSION"
          echo "Latest on npm: $LATEST_VERSION"

          if [ "$INSTALLED_VERSION" != "$LATEST_VERSION" ] || [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            echo "new_version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            echo "✅ Already up to date with upstream Patchright $LATEST_VERSION."
          fi

      - name: 📦 Install Latest Upstream & Build
        if: steps.check_version.outputs.needs_update == 'true'
        run: |
          echo "🚀 Updating to latest patchright..."
          npm install patchright@latest
          echo "📥 Installing latest patchright chromium..."
          npx patchright install chromium
          echo "🔨 Building project with latest upstream..."
          npm run build

      - name: 🔤 Install desktop fonts (Pixelscan coherence)
        if: steps.check_version.outputs.needs_update == 'true'
        run: |
          # Pixelscan's fingerprint check verifies the installed font set
          # against the claimed OS (server-side osFontsStatus). The bare
          # ubuntu runner image lacks the signature fonts of a real Ubuntu
          # desktop, so the masking card fails even though every other
          # signal is coherent (verified: the exact runner font set scores
          # osFontsStatus=false, and adding Ubuntu + Droid Sans Fallback +
          # Liberation Sans Narrow flips it to true). Install the
          # real-desktop font set before the test suite runs.
          # NOTE: fonts-liberation2 (Liberation 2.x, Croscore-based) does
          # NOT contain Liberation Sans Narrow — it was dropped in 2.0 and
          # split into its own upstream project (liberationfonts/
          # liberation-sans-narrow). That is why run 44723268530 still
          # failed: the package installed but no "Liberation Sans Narrow"
          # family ever appeared in fc-list. Install Narrow from the
          # upstream 1.07.5 release tarball instead.
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-ubuntu fonts-droid-fallback fonts-liberation2 fonts-freefont-ttf
          sudo mkdir -p /usr/share/fonts/truetype/liberation-narrow
          curl -fsSL --retry 3 -o /tmp/liberation-narrow-ttf.tar.gz https://github.com/liberationfonts/liberation-sans-narrow/releases/download/1.07.5/liberation-narrow-fonts-ttf-1.07.5.tar.gz
          sudo tar -xzf /tmp/liberation-narrow-ttf.tar.gz -C /tmp
          sudo find /tmp -name 'LiberationSansNarrow-*.ttf' -exec cp {} /usr/share/fonts/truetype/liberation-narrow/ \; -print
          fc-cache -f
          echo "Desktop font families now present:"
          fc-list : family | sort -u | grep -E "Ubuntu|Droid Sans Fallback|Liberation Sans Narrow|FreeSerif|FreeSans|FreeMono" || true
          echo "Full installed font families:"
          fc-list : family | sort -u || true
          # Diagnostic (never fails the step): ask Pixelscan's own server
          # whether the fonts this runner actually exposes score as a
          # coherent Linux desktop (osFontsStatus), using its /gf core
          # list intersected with fc-list.
          python3 - <<'PYEOF' || true
          import json, subprocess, time, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/156.0.0.0 Safari/537.36"}
          def post(url, payload):
              last = None
              for _ in range(3):
                  try:
                      req = urllib.request.Request(url, data=json.dumps(payload).encode(), method="POST", headers={"Content-Type": "application/json", **UA})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return json.load(r)
                  except Exception as e:
                      last = e
                      time.sleep(3)
              raise last
          try:
              core = post("https://pixelscan.net/s/api/gf", {"ic": True, "im": False})["value"]["core"]
              fams = set()
              out = subprocess.check_output(["fc-list", ":", "family"], text=True)
              for line in out.splitlines():
                  for f in line.split(","):
                      f = f.strip()
                      if f:
                          fams.add(f)
              detected = [f for f in core if f in fams]
              v = post("https://pixelscan.net/s/api/co", {"af": 0, "platform": "Linux x86_64", "fonts": detected, "canvas": True})["value"]
              print("[pixelscan-diag] core fonts probed:", len(core), "| detected on runner:", len(detected))
              print("[pixelscan-diag] Ubuntu detected:", "Ubuntu" in detected, "| Droid Sans Fallback:", "Droid Sans Fallback" in detected, "| Liberation Sans Narrow:", "Liberation Sans Narrow" in detected)
              print("[pixelscan-diag] osFontsStatus:", v.get("osFontsStatus"), "| os match:", v.get("comparedResult", {}).get("match"))
          except Exception as e:
              print("[pixelscan-diag] FAILED:", repr(e))
          PYEOF

      - name: 🧪 Run Comprehensive Test Suite
        if: steps.check_version.outputs.needs_update == 'true'
        run: |
          echo "🧪 Running full test suite (Rebrowser, Cloudflare WAF, Turnstile, Pixelscan, Recaptcha)..."
          xvfb-run -a npm test

      - name: 🚀 Commit and Push Patched Update
        if: steps.check_version.outputs.needs_update == 'true'
        run: |
          NEW_VER="${{ steps.check_version.outputs.new_version }}"
          git add package.json package-lock.json lib/ dist/
          git commit -m "chore(upstream): auto-sync patchright to v$NEW_VER [skip ci]" || exit 0
          git push origin main
          echo "✅ Successfully synced and pushed upstream patchright v$NEW_VER"


