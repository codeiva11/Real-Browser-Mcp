name: 🚀 Build, Version & Publish to NPM

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '*.md'
      - 'LICENSE.md'
      - '.gitignore'

  workflow_dispatch:
    inputs:
      increment_type:
        description: '📈 Version increment type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: '🧪 Dry run (check build/test without publishing to NPM)'
        required: false
        default: false
        type: boolean

jobs:
  publish:
    name: 🚀 Publish to NPM
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, '🔖 Release:')
    permissions:
      contents: write
      packages: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: ⚙️ Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🧪 Pre-Publish Verification
        run: |
          echo "💡 Running build..."
          npm run build
          echo "💡 Running basic syntax and file checks..."
          node -c dist/lib/cjs/index.js
          node -c lib/esm/index.mjs
          echo "✅ Code syntax is valid."

      - name: 📈 Increment Version
        id: versioning
        run: |
          # Determine the increment type (major, minor, or patch)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INCREMENT_TYPE="${{ github.event.inputs.increment_type }}"
          else
            COMMIT_MSG=$(git log -1 --pretty=%B)
            if echo "$COMMIT_MSG" | grep -qE "\[major\]|BREAKING CHANGE"; then
              INCREMENT_TYPE="major"
            elif echo "$COMMIT_MSG" | grep -qE "\[minor\]|feat:"; then
              INCREMENT_TYPE="minor"
            else
              INCREMENT_TYPE="patch"
            fi
          fi

          echo "📈 Selected increment type: $INCREMENT_TYPE"
          
          # Calculate the new version before bumping
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "📦 Current version: $CURRENT_VERSION"
          
          # Calculate expected new version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          case "$INCREMENT_TYPE" in
            major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
            minor) NEW_VERSION="$MAJOR.$((MINOR + 1)).0" ;;
            patch) NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          esac
          echo "🔮 Expected new version: $NEW_VERSION"
          
          # Check if tag already exists locally and remove it
          if git tag -l "v$NEW_VERSION" | grep -q "v$NEW_VERSION"; then
            echo "⚠️ Tag v$NEW_VERSION exists locally, removing..."
            git tag -d "v$NEW_VERSION"
          fi
          
          # Check if tag exists on remote and delete it
          if git ls-remote --tags origin "v$NEW_VERSION" | grep -q "v$NEW_VERSION"; then
            echo "⚠️ Tag v$NEW_VERSION exists on remote, deleting..."
            git push origin --delete "v$NEW_VERSION" || true
          fi
          
          # Bump version, commit changes and create tag
          npm version $INCREMENT_TYPE -m "🔖 Release: v%s [skip ci]"
          
          # Capture actual new version for subsequent steps
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "✅ New version: $NEW_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: 🚀 Push Version Bump & Tag
        if: github.event.inputs.dry_run != 'true'
        run: |
          git push origin HEAD --follow-tags

      - name: 📦 Publish Package to NPM
        if: github.event.inputs.dry_run != 'true'
        run: |
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 📋 Create GitHub Release
        if: github.event.inputs.dry_run != 'true'
        run: |
          TAG="v${{ steps.versioning.outputs.NEW_VERSION }}"
          
          cat > release_body.md <<'EOF'
          ## 🚀 Real Browser MCP Server v${{ steps.versioning.outputs.NEW_VERSION }}
          
          ### 📦 Published Packages
          - **NPM Package**: [real-browser-mcp-server](https://www.npmjs.com/package/real-browser-mcp-server)
          - **Stealth automation**: Powered by Patchright (undetected Playwright fork).
          
          ### 🛠️ Key Capabilities
          * **Turnstile Bypass**: Solves Cloudflare Turnstile automatically.
          * **Ad Blocker**: Integrated `@ghostery/adblocker-playwright` with binary caching.
          * **Stealth Evasion**: Passes advanced bot checkers like CreepJS, Datadome, Pixelscan, and FingerprintJS.
          
          ### 📥 Installation
          ```bash
          npm install real-browser-mcp-server@${{ steps.versioning.outputs.NEW_VERSION }}
          ```
          
          ---
          *Auto-generated with ❤️ by GitHub Actions*
          EOF
          
          gh release create "$TAG" \
            --title "Release $TAG" \
            --notes-file release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: 🐳 Log in to GitHub Container Registry (GHCR)
        if: github.event.inputs.dry_run != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN || github.token }}

      - name: 🏷️ Extract Docker metadata
        if: github.event.inputs.dry_run != 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=true
            type=raw,value=${{ steps.versioning.outputs.NEW_VERSION }}

      - name: 🔨 Build and Push Docker Image
        if: github.event.inputs.dry_run != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
